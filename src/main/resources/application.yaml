spring:
  application:
    name: user-service

  # datasource details
  datasource:
    url: jdbc:mysql://localhost:3306/user_service_db
    username: root
    password: root


  jpa:
#    show-sql: true
    properties:
      hibernate:
        # Format SQL queries for readability
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
        # Configure JPA/Hibernate to control the database schema, possible values: create,create-drop,update,validate,none
      ddl-auto: update

# Display spring-bott-actuator in swagger
springdoc:
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: info, health, beans, mappings
  info:
    env:
      enabled: true

info:
  app:
    name: "User Service"
    description: "User Service API"
    version: "1.0.0"

logging:
  level:
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace

jwt:
