spring:
  application:
    name: user-service

  # datasource details
  datasource:
    url: jdbc:mysql://localhost:3306/user_service_db
    username: root
    password: root


  jpa:
#    show-sql: true
    properties:
      hibernate:
        # Format SQL queries for readability
        format_sql: false
    hibernate:
        # Configure JPA/Hibernate to control the database schema, possible values: create,create-drop,update,validate,none
      ddl-auto: update
  jackson:
    deserialization:
      # Configure jackson to throw error on receiving unknown fields
      fail-on-unknown-properties: true

application:
  jwt:
    algorithm: "HS256"
    expiry: 3600
    issuer: "https://theinfinity007.github.io"
    scopes: "openid profile email offline_access"
    secret: "556e19c172530255c55c001dc574032499f13b19725263548e552e5a385fa95a"

  security:
    permitted:
      url-pattern: "${security.permitted.url-pattern:/swagger-ui/**,/v3/api-docs/**,/actuator/**}"
    anonymous:
      access-route:
        "POST:/v1/users/login,POST:/v1/users,GET:/v1/users/{email},POST:/v1/oauth/token,POST:/v1/oauth/revoke,POST:/v1/apikeys"
    auth:
      jwt-access-route: "GET:/v1/users/me,PUT:/v1/users/me,DELETE:/v1/users/me"
# Display spring-bott-actuator in swagger
springdoc:
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: info, health, beans, mappings
  info:
    env:
      enabled: true

info:
  app:
    name: "User Service"
    description: "User Service API"
    version: "1.0.0"

logging:
  level:
    org:
      springframework:
        security: TRACE
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace
    com:
      theinfinity007:
        user_service: TRACE


